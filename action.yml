name: 'Worklog Daily Reporter'
description: 'Generate a private daily GitHub activity report and deploy to GitHub Pages'
author: 'deariary'

branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access and deployment (requires contents: write permission)'
    required: true
  username:
    description: 'GitHub username to generate the report for'
    required: false
    default: ${{ github.actor }}
  mode:
    description: 'Run mode: "daily" (full daily report) or legacy "weekly"'
    required: false
    default: 'daily'
  language:
    description: 'Report language (en, ja, zh-CN, zh-TW, ko, es, fr, de, pt, ru)'
    required: false
    default: 'en'
  timezone:
    description: 'IANA timezone for date calculations (e.g. "Asia/Tokyo", "UTC")'
    required: false
    default: 'UTC'
  openai-api-key:
    description: 'OpenAI API key for AI narrative'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key for AI narrative'
    required: false
    default: ''
  gemini-api-key:
    description: 'Gemini API key for AI narrative'
    required: false
    default: ''
  openrouter-api-key:
    description: 'OpenRouter API key for AI narrative (access multiple models via unified API)'
    required: false
    default: ''
  groq-api-key:
    description: 'Groq API key for AI narrative (fast inference)'
    required: false
    default: ''
  grok-api-key:
    description: 'Grok (xAI) API key for AI narrative'
    required: false
    default: ''
  llm-provider:
    description: 'Optional LLM provider (openai, anthropic, gemini, openrouter, groq, grok).'
    required: false
    default: ''
  llm-model:
    description: 'Optional LLM model name.'
    required: false
    default: ''
  theme:
    description: 'Report theme: brutalist, minimal, editorial, swiss'
    required: false
    default: 'brutalist'
  date:
    description: 'Report date (YYYY-MM-DD). Defaults to the previous workday.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2

    - name: Build Worklog action
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        bun install --frozen-lockfile
        bun run build

    - name: Configure git and sync
      shell: bash
      run: |
        git config user.name "github-weekly-reporter[bot]"
        git config user.email "github-weekly-reporter[bot]@users.noreply.github.com"
        git pull --rebase || true

    # --- Daily mode: collect a complete one-day dataset ---

    - name: Daily fetch
      if: inputs.mode == 'daily'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_USERNAME: ${{ inputs.username }}
        TIMEZONE: ${{ inputs.timezone }}
        DATA_DIR: ./data
        INPUT_DATE: ${{ inputs.date }}
      run: bun "$GITHUB_ACTION_PATH/dist/cli/index.js" daily-fetch ${INPUT_DATE:+--date "$INPUT_DATE"}

    # --- Legacy weekly mode ---

    - name: Weekly fetch (build full data from accumulated events)
      if: inputs.mode == 'weekly'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_USERNAME: ${{ inputs.username }}
        TIMEZONE: ${{ inputs.timezone }}
        DATA_DIR: ./data
        INPUT_DATE: ${{ inputs.date }}
      run: bun "$GITHUB_ACTION_PATH/dist/cli/index.js" weekly-fetch ${INPUT_DATE:+--date "$INPUT_DATE"}

    - name: Generate AI content
      if: inputs.mode == 'daily' || inputs.mode == 'weekly'
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        GROK_API_KEY: ${{ inputs.grok-api-key }}
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        LLM_MODEL: ${{ inputs.llm-model }}
        LANGUAGE: ${{ inputs.language }}
        TIMEZONE: ${{ inputs.timezone }}
        DATA_DIR: ./data
        INPUT_DATE: ${{ inputs.date }}
      run: bun "$GITHUB_ACTION_PATH/dist/cli/index.js" generate --mode "${{ inputs.mode }}" ${INPUT_DATE:+--date "$INPUT_DATE"}

    - name: Commit and push report data
      if: inputs.mode == 'daily' || inputs.mode == 'weekly'
      shell: bash
      env:
        TIMEZONE: ${{ inputs.timezone }}
        INPUT_DATE: ${{ inputs.date }}
      run: |
        git add -f data/
        if git diff --cached --quiet; then
          echo "No new data to commit"
        else
          MSG=$(bun "$GITHUB_ACTION_PATH/dist/cli/index.js" commit-msg ${{ inputs.mode }} ${INPUT_DATE:+--date "$INPUT_DATE"})
          git commit -m "${MSG}"
          git push
        fi

    - name: Render HTML report
      if: inputs.mode == 'daily' || inputs.mode == 'weekly'
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
        TIMEZONE: ${{ inputs.timezone }}
        THEME: ${{ inputs.theme }}
        DATA_DIR: ./data
        OUTPUT_DIR: ./output
        SITE_TITLE: ${{ env.SITE_TITLE }}
        BASE_URL: ${{ env.BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        INPUT_DATE: ${{ inputs.date }}
      run: bun "$GITHUB_ACTION_PATH/dist/cli/index.js" render --mode "${{ inputs.mode }}" ${INPUT_DATE:+--date "$INPUT_DATE"}

    - name: Deploy to GitHub Pages
      if: inputs.mode == 'daily' || inputs.mode == 'weekly'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        OUTPUT_DIR: ./output
        INPUT_DATE: ${{ inputs.date }}
      run: bun "$GITHUB_ACTION_PATH/dist/cli/index.js" deploy ${INPUT_DATE:+--date "$INPUT_DATE"}
