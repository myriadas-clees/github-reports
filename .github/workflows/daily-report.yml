# Daily Worklog — publish the previous completed workday

name: Daily Report

on:
  schedule:
    # 01:27 EST / 02:27 EDT; derived from the configured America/New_York timezone.
    - cron: '27 6 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date (YYYY-MM-DD, default: previous workday)'
        required: false
        type: string
      publish:
        description: 'Deploy Pages after generating the report'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_TITLE: Worklog
  # Keep this synchronized with config.yaml and the cron above.
  TIMEZONE: America/New_York

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Fetch and generate
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
          DATA_DIR: ./data
          CONFIG_PATH: ./config.yaml
          INPUT_DATE: ${{ inputs.date }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}
        run: |
          fill_date() {
            local report_date="$1"
            local dir="data/${report_date//-//}"
            if [ ! -f "$dir/github-data.yaml" ]; then
              echo "Fetching $report_date"
              bun dist/cli/index.js daily-fetch --date "$report_date"
            fi
            if [ ! -f "$dir/llm-data.yaml" ]; then
              echo "Generating $report_date"
              bun dist/cli/index.js generate --date "$report_date"
            fi
            if [ -f "$dir/github-data.yaml" ] && [ -f "$dir/llm-data.yaml" ]; then
              echo "Complete $report_date"
            fi
          }

          if [ -n "$INPUT_DATE" ]; then
            echo "Fetching $INPUT_DATE"
            bun dist/cli/index.js daily-fetch --date "$INPUT_DATE"
            echo "Generating $INPUT_DATE"
            bun dist/cli/index.js generate --date "$INPUT_DATE"
            exit 0
          fi

          cursor=$(TZ="$TIMEZONE" date -d "yesterday" +%F)
          filled=0
          while [ "$filled" -lt 3 ]; do
            dow=$(TZ="$TIMEZONE" date -d "$cursor" +%u)
            if [ "$dow" -le 5 ]; then
              fill_date "$cursor"
              filled=$((filled + 1))
            fi
            cursor=$(TZ="$TIMEZONE" date -d "$cursor - 1 day" +%F)
          done

      - name: Commit report data
        run: |
          git config user.name "worklog[bot]"
          git config user.email "worklog[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: daily report"
            git push
          fi

      - name: Render HTML
        env:
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}
          THEME: ${{ vars.THEME || 'brutalist' }}
          DATA_DIR: ./data
          OUTPUT_DIR: ./output
          SITE_TITLE: ${{ env.SITE_TITLE }}
          BASE_URL: ${{ vars.BASE_URL || 'https://myriadas-clees.github.io/github-reports' }}
          CONFIG_PATH: ./config.yaml
        run: bash scripts/render-daily-archive.sh

      - name: Upload worklog site
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    if: ${{ github.event_name == 'schedule' || inputs.publish }}
    needs: daily
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy worklog to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v5
