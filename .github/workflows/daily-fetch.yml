# Daily Fetch — accumulate yesterday's GitHub events (incl. private)

name: Daily Fetch

on:
  schedule:
    - cron: '0 5 * * *'  # ~midnight America/New_York (adjust for your timezone)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Daily fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          DATA_DIR: ./data
          CONFIG_PATH: ./config.yaml
        run: bun dist/cli/index.js daily-fetch

      - name: Commit data
        run: |
          git config user.name "worklog[bot]"
          git config user.email "worklog[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "data: daily fetch"
            git push
          fi
