# Weekly Report — Thu–Wed status page every Thursday morning

name: Weekly Report

on:
  schedule:
    # Thursday ~01:00 America/New_York ≈ 06:00 UTC (adjust for your timezone)
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, default: today)'
        required: false
        type: string

permissions:
  contents: write
  pages: write

env:
  SITE_TITLE: Worklog

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Weekly fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          DATA_DIR: ./data
          CONFIG_PATH: ./config.yaml
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            bun dist/cli/index.js weekly-fetch --date "$INPUT_DATE"
          else
            bun dist/cli/index.js weekly-fetch
          fi

      - name: Generate summary
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          DATA_DIR: ./data
          CONFIG_PATH: ./config.yaml
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            bun dist/cli/index.js generate --date "$INPUT_DATE"
          else
            bun dist/cli/index.js generate
          fi

      - name: Commit data
        run: |
          git config user.name "worklog[bot]"
          git config user.email "worklog[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: weekly report"
            git push
          fi

      - name: Render HTML
        env:
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
          THEME: ${{ vars.THEME || 'brutalist' }}
          DATA_DIR: ./data
          OUTPUT_DIR: ./output
          SITE_TITLE: ${{ env.SITE_TITLE }}
          BASE_URL: ${{ vars.BASE_URL }}
          CONFIG_PATH: ./config.yaml
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            bun dist/cli/index.js render --date "$INPUT_DATE"
          else
            bun dist/cli/index.js render
          fi

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ./output
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            bun dist/cli/index.js deploy --date "$INPUT_DATE"
          else
            bun dist/cli/index.js deploy
          fi
