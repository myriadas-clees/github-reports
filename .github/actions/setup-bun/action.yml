name: Setup Bun
description: Install the pinned Bun runtime and restore its package download cache

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.12

    - name: Cache Bun downloads
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
