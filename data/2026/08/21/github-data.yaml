commitMessages:
  - repo: Myriad-Advisor-Solutions/myriadas-apps
    messages:
      - "fix(proforma): address PR review regressions"
      - "fix(proforma): preserve and reconcile practice expenses"
      - "fix(proforma): reconcile annual local expenses"
      - "test(proforma): stabilize PDF determinism check"
      - "fix(proforma): keep custom category editor open"
      - "fix(proforma): reconcile custom platform fees"
      - "fix(proforma): expose and reconcile one-time costs"
      - "fix(proforma): reconcile annual fees and label drafts"
      - "fix(proforma): expose RIA monthly platform fees"
      - "fix(proforma): grow workbook expense schedules"
      - "fix(proforma): reconcile FiNet annual fees"
      - "fix(proforma): preserve advisor values across roles"
      - "fix(ui): cap topbar account menu width"
      - Align the selected recruit model with intake steps and polish the live UI.
      - "fix(ci): deploy prebuilt SWA Functions without rebuilding"
      - "fix(ci): deploy prebuilt SWA Functions without rebuilding (#101)"
      - "fix(hub): use configured SWA hostname for preview links"
      - "fix(hub): use configured SWA hostname for preview links (#102)"
      - Align Proforma with solo intake and one economics model so derived locations, payout grid, per-person Cloud PC,
        and tax tables stay consistent, details AUM persists, and Budget $400 is not counted twice.
      - "fix(proforma): persist Details Save Model and satisfy isSolo typecheck"
      - Keep Proforma readable at 2880 and 720-tall viewports so dashboard KPIs, intake fields, and wizard Continue stay
        on screen without hydration flicker.
      - Fix Codex review defects on estimated AUM, scenario projections, and intake persistence.
      - Keep explicit multi-office location counts above derived state codes.
      - Fix follow-up Codex review on Details AUM seed, location edits, and annual workbook fees.
      - Submit the solo-normalized roster when creating an independent practice.
      - Fix recruit intake persistence validation
      - Simplify FiNet assumptions and benefits
      - Remove solo recruit intake path
      - Fix FiNet report layout and exports
      - Improve selected choice contrast
      - Fix dark theme choice contrast
      - Align recruit notes field
      - Fix licensed toggle contrast
      - Show payout after local expenses
      - Prevent donut total clipping
      - Enlarge payout donut layout
      - Require explicit recruit creation
      - Align expense occurrences with source workbook
      - Correct FiNet pricing schedule calculations
      - Align setup budget Excel occurrences
      - Match setup budget workbook styling
      - Update FiNet reconciliation expectations
      - Match workbook export to advisor proforma
      - Theme remaining proforma workbook sheets
      - Consolidate and compact proforma workbooks
      - Fix Codex review findings
      - Align FiNet wizard payout basis
