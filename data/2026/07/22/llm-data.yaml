  - type: pr
    title: "ci(actions): reduce automatic runtime"
    repo: Myriad-Advisor-Solutions/ohcpwm-apps
    meta: merged · +120 −95
    body: >-
      Why


      Pull requests were spending runner minutes on duplicated validation, serialized builds, and automatic Azure
      preview deployments that are not needed for every change.


      What changed


      - Run `verify`
    url: https://github.com/Myriad-Advisor-Solutions/ohcpwm-apps/pull/68
  - type: pr
    title: "ci: gate previews behind PR label"
    repo: Myriad-Advisor-Solutions/myriadas-apps
    meta: merged · +65 −40
    body: >-
      Why


      Unlabeled pull requests were consuming Azure preview runners on every update, while verification repeated
      production build work.


      What changed


      * Keep the existing `Verify` workflow/job as the PR
    url: https://github.com/Myriad-Advisor-Solutions/myriadas-apps/pull/38
