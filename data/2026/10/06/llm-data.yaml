highlights:
  - type: pr
    title: "fix(northstar): recognize Microsoft consent errors wrapped in invalid_grant"
    repo: Myriad-Advisor-Solutions/ohcpwm-apps
    meta: merged · +62 −19
    body: Microsoft can return a missing-consent failure as `invalid_grant` with `suberror=consent_required` or error code
      `65001`. Northstar classified that response as an expired session, exposing silent reco
    url: https://github.com/Myriad-Advisor-Solutions/ohcpwm-apps/pull/151
  - type: pr
    title: Stabilize Northstar entry and asynchronous recovery
    repo: Myriad-Advisor-Solutions/ohcpwm-apps
    meta: merged · +1762 −299
    body: Northstar entry and interaction could lose focus or remain stuck while session checks and Microsoft requests were
      loading. Source inspection and synthetic tests verified link remounts, shifting launch
    url: https://github.com/Myriad-Advisor-Solutions/ohcpwm-apps/pull/148
  - type: pr
    title: "fix(northstar): stop redundant user consent after tenant approval"
    repo: Myriad-Advisor-Solutions/ohcpwm-apps
    meta: merged · +642 −66
    body: New Northstar users were forced through Microsoft consent because OAuth start treated an empty per-user connection
      record as evidence that consent was missing. `prompt=consent` can still block users a
    url: https://github.com/Myriad-Advisor-Solutions/ohcpwm-apps/pull/149
  - type: pr
    title: "feat(transition): retain multiple contact methods per person"
    repo: Myriad-Advisor-Solutions/myriadas-apps
    meta: merged · +3744 −897
    body: Accounts CSV alternate email/phone columns belong to the same primary person. Scalar storage and secondary-owner
      assignment dropped legitimate methods or forced incorrect choices. This retains every d
    url: https://github.com/Myriad-Advisor-Solutions/myriadas-apps/pull/147
  - type: pr
    title: "feat(transition): widen checklist notes editor"
    repo: Myriad-Advisor-Solutions/myriadas-apps
    meta: merged · +0 −0
    body: |-
      ## Why

      Checklist notes need more room for multiline transition context.

      ## What changed

      Gives the Notes editor 12 rows, an 18rem minimum height, and vertical resizing. Required and due-date fields 
    url: https://github.com/Myriad-Advisor-Solutions/myriadas-apps/pull/146
